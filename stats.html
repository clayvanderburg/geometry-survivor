<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Developer dashboard: unlinked from the game (only the hidden tuner drawer, Shift+Alt+T, links here). -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Vexolith Balance Stats</title>
  <style>
    :root {
      --bg: #050812;
      --surface: #0b1124;
      --surface-2: #10182f;
      --line: rgba(255, 255, 255, 0.09);
      --grid: rgba(255, 255, 255, 0.07);
      --text: #e9f1ff;
      --text-2: #a9bad6;
      --muted: #6f819f;
      --cyan: #00f3ff;
      --series-a: #2a95c4;
      --series-b: #c47a1a;
      --buff: #5fd38d;
      --nerf: #ff6b81;
      --ok: #8ea2c4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
    body { padding: 18px 16px 40px; max-width: 1280px; margin: 0 auto; overflow-x: hidden; }
    h1 { font-size: 20px; letter-spacing: 3px; margin: 0; color: #fff; text-shadow: 0 0 14px rgba(0, 243, 255, 0.55); }
    h1 span { color: #ff3d9a; }
    h2 { font-size: 12px; letter-spacing: 2px; color: var(--cyan); margin: 0 0 4px; text-transform: uppercase; }
    .sub { color: var(--text-2); font-size: 12px; margin: 2px 0 0; }
    .muted { color: var(--muted); }
    header { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; }
    .sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .source { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--sc); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
    .source b { color: var(--sc); letter-spacing: 1px; }
    .source select, .source button, .file-btn { background: var(--surface-2); color: var(--text); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    .file-btn input { display: none; }
    .status { flex-basis: 100%; font-size: 11px; color: var(--text-2); min-height: 16px; word-break: break-word; }
    .status.err { color: var(--nerf); }
    section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; min-width: 0; }
    .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 10px; }
    .note { font-size: 11.5px; color: var(--text-2); max-width: 760px; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
    .tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .tile .label { font-size: 10px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
    .tile .val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tile .val small { font-size: 11px; font-weight: 600; color: var(--text-2); }
    .tile .ab { display: flex; gap: 10px; flex-wrap: wrap; }
    .tile .ab span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--sc); }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2); }
    .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--sc); }
    .table-wrap { overflow-x: auto; max-width: 100%; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
    th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th { color: var(--muted); font-weight: 700; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
    th:first-child, td:first-child { text-align: left; }
    tr.deadly td:first-child::after { content: ' ☠ DEADLY'; color: var(--nerf); font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .flag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.8px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
    .flag.buff { color: var(--buff); }
    .flag.nerf { color: var(--nerf); }
    .flag.low { color: var(--muted); border-style: dashed; }
    td.cell { text-align: center; }
    td.cell.buff { background: rgba(95, 211, 141, 0.14); }
    td.cell.nerf { background: rgba(255, 107, 129, 0.14); }
    td.cell.low { color: var(--muted); }
    td.cell small { display: block; font-size: 10px; color: var(--text-2); }
    .inline-bar { display: inline-block; height: 6px; border-radius: 0 3px 3px 0; background: var(--series-a); vertical-align: middle; margin-left: 6px; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    svg text { fill: var(--text-2); font: 11px 'Segoe UI', system-ui, sans-serif; }
    svg .axis { stroke: var(--grid); }
    svg .ref { stroke: rgba(255, 255, 255, 0.35); stroke-dasharray: 3 3; }
    svg .ref-mid { stroke: rgba(255, 255, 255, 0.55); }
    svg .hit:hover { fill-opacity: 0.85; }
    details summary { cursor: pointer; color: var(--text-2); font-size: 12px; margin: 8px 0; }
    .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
    @media (max-width: 760px) {
      .sources, .grid2 { grid-template-columns: minmax(0, 1fr); }
      body { padding: 14px 16px 30px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>VEXOLITH <span>//</span> BALANCE STATS</h1>
      <p class="sub">Anonymous run stats from players (<code>/api/stats/summary</code>) and the balance simulator (<code>--stats-out</code>), side by side.</p>
    </div>
  </header>

  <div class="sources">
    <div class="source" style="--sc: var(--series-a)" data-slot="a">
      <b>A</b>
      <select data-version aria-label="Dataset A version"><option value="all">Players · all versions</option></select>
      <select data-armory aria-label="Dataset A Armory tier"><option value="">Any Armory</option><option value="none">No Armory</option><option value="partial">Partial Armory</option><option value="maxed">Maxed Armory</option><option value="unknown">Armory not recorded (older clients)</option></select>
      <label class="file-btn">Load JSON…<input type="file" accept="application/json,.json" data-file /></label>
      <div class="status" data-status></div>
    </div>
    <div class="source" style="--sc: var(--series-b)" data-slot="b">
      <b>B</b>
      <select data-version aria-label="Dataset B version"><option value="">None</option><option value="all">Players · all versions</option></select>
      <select data-armory aria-label="Dataset B Armory tier"><option value="">Any Armory</option><option value="none">No Armory</option><option value="partial">Partial Armory</option><option value="maxed">Maxed Armory</option><option value="unknown">Armory not recorded (older clients)</option></select>
      <label class="file-btn">Load JSON…<input type="file" accept="application/json,.json" data-file /></label>
      <div class="status" data-status></div>
    </div>
  </div>

  <main id="dashboard"><p class="empty">Loading…</p></main>

  <script type="module" src="js/stats-dashboard.js"></script>
</body>
</html>
