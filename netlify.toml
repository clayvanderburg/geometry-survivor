# Netlify publishes only the playable game; tests, tools and dev docs stay out of the site.
[build]
  command = "rm -rf dist && mkdir dist && cp -r index.html tuner.html stats.html css js dist/"
  publish = "dist"

# The global leaderboard API (/api/scores, see netlify/functions/scores.mjs) deploys alongside the
# static site. Netlify installs package.json dependencies (@netlify/blobs) before bundling it;
# the game in the browser still loads no third-party code.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
